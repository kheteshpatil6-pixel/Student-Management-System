{% extends "base.html" %}
{% block content %}
<h2>Initial Admin Setup</h2>
<form method="POST">
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" class="form-control" required>
    </div>
    <div class="form-group">
        <label>Email (will also be the username)</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required minlength="8">
    </div>
    <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm" class="form-control" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary mt-3">Create Admin</button>
</form>
{% endblock %}
